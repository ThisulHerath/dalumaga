name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pilot
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: dalumaga_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilot -d dalumaga_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: '1'
      HUSKY: '0'
      DATABASE_URL: postgresql://pilot:ephemeral_ci_only@127.0.0.1:5432/dalumaga_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check PR commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
      - run: pnpm db:migrate
      - run: pnpm db:status
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
