components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access token; bind to actor, device and current assignments.
    trackerBearer:
      type: http
      scheme: bearer
      description: GPS integration credential with a distinct audience and provider identity.
  parameters:
    Limit:
      in: query
      name: limit
      description: Maximum page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      in: query
      name: cursor
      description: Opaque continuation from next_cursor. Omit for first page; null next_cursor ends traversal.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Client-generated UUID conserved across retries of this command.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Malformed request, invalid cursor, unaddressable items or repeated IDs in a batch.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, expired or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Actor lacks scope, assignment or delegated permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource unavailable in the caller's visible scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Request rate exceeded; respect Retry-After.
      headers:
        Retry-After:
          description: Minimum seconds before retry.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Temporary failure. Retry eligible commands with stable IDs.
      headers:
        Retry-After:
          description: Minimum seconds before retry.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidInput:
      description: Request-level semantic validation failed. Addressable bulk item errors are returned in the
        result array.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request-level key reuse or resource conflict. Addressable bulk event conflicts are returned
        per item.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: Request exceeded its size limit; split the batch without changing IDs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Role:
      type: string
      enum:
      - weigher
      - driver
      - receiver
      - dispatcher
      - manager
      - admin
    WeightGrams:
      type: integer
      minimum: 0
      maximum: 999999999
    EventId:
      type: string
      format: uuid
    StopReason:
      type: string
      enum:
      - tea
      - toilet
      - breakdown
      - emergency
      - other
    Stage:
      type: string
      enum:
      - pickup
      - receipt
    AlertKind:
      type: string
      enum:
      - weight_difference
      - late_risk
      - unexplained_stop
      - emergency
    ErrorDetail:
      type: object
      properties:
        path:
          type: string
        message:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - path
      - message
      additionalProperties: false
    Error:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 256
        message:
          type: string
          minLength: 1
          maxLength: 256
        request_id:
          type: string
          format: uuid
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
      required:
      - code
      - message
