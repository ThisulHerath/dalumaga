        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: assignCrateLoad
      tags:
      - Batches
      summary: Assign Crate Load
      description: Issue a fresh loading identity for the batch and crate. Carry its reference to the receiver.
        Backend enforces factory and assignment scope. Field users see only their assigned trips or resources.
      x-roles:
      - weigher
      - dispatcher
      - admin
      x-idempotency: Require Idempotency-Key. Replay the committed result for the same principal, operation, path,
        key and canonical request. Changed content returns 409. Reserve the key and commit the mutation, audit
        and response atomically; retain the key through the pilot retry window.
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Load'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadCreate'
  /batches/{batch_id}/completion:
    post:
      operationId: completeBatch
      tags:
      - Batches
      summary: Complete Batch
      description: Record physical completion at the configured milestone for the entire batch. Keep independent
        comparison state pending when necessary. Backend enforces factory and assignment scope. Field users see
        only their assigned trips or resources.
      x-roles:
      - receiver
      - dispatcher
      - admin
      x-idempotency: Require Idempotency-Key. Replay the committed result for the same principal, operation, path,
        key and canonical request. Changed content returns 409. Reserve the key and commit the mutation, audit
        and response atomically; retain the key through the pilot retry window.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCompletion'
  /sync/events:
    post:
      operationId: syncEvents
      tags:
      - Sync
      summary: Sync Events
      description: 'Process up to 50 events and 128 KiB in independent transactions. Each item must have a valid
        unique-in-request UUID; malformed outer envelopes, missing/unusable IDs or repeated IDs within one request
        return 400 before any commit. For addressable items validate kind/body per item, not with a whole-array
        validation pipe. Return one keyed result for every item, including mixed outcomes. Enforce actor/device
        identity and assignment. Pickup: weigher; receipt: receiver; handover, stop, resume: driver; corrections:
        delegated requester; decisions: delegated approver. Never trust client-supplied verified status. A receipt
        can precede pickup; a missing causal prerequisite blocks only its dependent item. Retry retryable/unknown
        outcomes with the original envelopes. Scope checks on replay precede disclosing prior results. Backend
        enforces factory and assignment scope. Field users see only their assigned trips or resources.'
      x-roles:
      - weigher
      - driver
      - receiver
      - dispatcher
      - manager
      - admin
      x-idempotency: Use client_event_id and the shared sync ledger across this route and bulk sync. Identical
        replay returns the first receipt time. Changed envelope or competing capture returns a conflict; never
        overwrite an original.
      responses:
        '200':
          description: One result per event. Accepted/duplicate have the original server receipt time. Conflict,
            blocked, rejected and retry are item outcomes even when all items fail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
              example:
                results:
                - id: 00000000-0000-4000-8000-000000000001
                  status: duplicate
                  received_at: '2026-11-25T04:10:00Z'
                - id: 00000000-0000-4000-8000-000000000008
                  status: conflict
                  error:
                    code: STAGE_ALREADY_CAPTURED
                    message: This load already has a pickup reading.
                    request_id: 00000000-0000-4000-8000-000000000003
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatch'
            example:
              v: 1
              events:
              - v: 1
                client_event_id: 00000000-0000-4000-8000-000000000001
                kind: weigh
                actor_id: 00000000-0000-4000-8000-000000000002
                device_id: 00000000-0000-4000-8000-000000000003
                trip_id: 00000000-0000-4000-8000-000000000004
                local_seq: 41
                occurred_at: '2026-11-25T03:15:00Z'
                clock: &id001
                  quality: unknown
                depends_on: null
                body:
                  load_id: 00000000-0000-4000-8000-000000000005
                  stage: pickup
                  scale_id: 00000000-0000-4000-8000-000000000006
                  gross_g: 20000
                  tare_id: 00000000-0000-4000-8000-000000000007
                  observed_tare_g: 2000
                  capture_method: scale
