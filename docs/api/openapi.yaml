openapi: 3.1.1
info:
  title: DaluMaga pilot API
  version: 1.0.0
  description: 'Proposed NestJS HTTP contract for one pilot factory. Grams are integers; timestamps include an
    offset. The server records receipt time independently. Field clients use immutable v1 envelopes for retries.
    Corrections append revisions. GPS gaps never imply stops. x-roles lists eligible business roles before delegation
    and assignment checks; an empty list denotes an authentication endpoint or a service-only route as specified
    by security. Error codes are stable machine strings; localize presentation in the client. For list endpoints
    without a stated ordering, default to resource UUID ascending; vehicles use trip_id and weight comparisons
    use load_id. Precise retention of idempotency keys is a deployment policy: clients must not replay retired
    command keys.'
servers:
- url: /v1
security:
- userBearer: []
tags:
- name: Authentication
- name: Crates
- name: Trips
- name: Batches
- name: Sync
- name: Weighing
- name: Corrections
- name: Stops
- name: GPS
- name: Dashboard
- name: Alerts
paths:
  /auth/login:
    post:
      operationId: login
      tags:
      - Authentication
      summary: Login
      description: Exchange username/password and enrolled device ID for an access token and a device-bound refresh
        token. Invalid credentials return 401.
      x-roles: []
      x-idempotency: Starting a new session is not idempotent. No key is accepted.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/refresh:
    post:
      operationId: refreshSession
      tags:
      - Authentication
      summary: Refresh Session
      description: Authenticate with the refresh token in the body and verify the device binding. Successful refresh
        rotates the token; expired or reused tokens return 401.
      x-roles: []
      x-idempotency: Single-use rotation. Serialize refresh requests on the client. Reauthenticate if a successful
        rotated response is lost.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /crates:
    get:
      operationId: listCrates
      tags:
      - Crates
      summary: List Crates
      description: List crates available to this account. Cursor pages use a stable sort plus UUID as tie-breaker;
        cursors are opaque, scoped to the filters and actor. Invalid cursors return 400. Backend enforces factory
        and assignment scope. Field users see only their assigned trips or resources.
      x-roles:
      - weigher
      - driver
      - receiver
      - dispatcher
      - manager
      - admin
      x-idempotency: Safe read. No idempotency key.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CratePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - in: query
        name: qr_code
        schema:
          type: string
        description: Exact QR filter.
    post:
      operationId: createCrate
      tags:
      - Crates
      summary: Create Crate
      description: Register a permanent QR identity. QR collisions return 409. Backend enforces factory and assignment
        scope. Field users see only their assigned trips or resources.
      x-roles:
      - admin
      x-idempotency: Require Idempotency-Key. Replay the committed result for the same principal, operation, path,
        key and canonical request. Changed content returns 409. Reserve the key and commit the mutation, audit
        and response atomically; retain the key through the pilot retry window.
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrateCreate'
  /crates/{crate_id}:
    get:
      operationId: getCrate
      tags:
      - Crates
      summary: Get Crate
      description: Return the crate and its currently valid tare, or null when unavailable. Backend enforces factory
        and assignment scope. Field users see only their assigned trips or resources.
      x-roles:
      - weigher
      - driver
      - receiver
      - dispatcher
      - manager
      - admin
      x-idempotency: Safe read. No idempotency key.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: crate_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /crates/{crate_id}/tares:
    post:
      operationId: verifyTare
      tags:
      - Crates
      summary: Verify Tare
      description: Requires delegated tare-verification permission. Append a verified tare version and preserve
        previous versions. Reject an invalid verification interval. Backend enforces factory and assignment scope.
        Field users see only their assigned trips or resources.
      x-roles:
      - weigher
      - receiver
      - admin
      x-idempotency: Require Idempotency-Key. Replay the committed result for the same principal, operation, path,
        key and canonical request. Changed content returns 409. Reserve the key and commit the mutation, audit
        and response atomically; retain the key through the pilot retry window.
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tare'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: crate_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TareCreate'
  /trips:
