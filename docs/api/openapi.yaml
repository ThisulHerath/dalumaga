        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /batches/{batch_id}/loads:
    get:
      operationId: listBatchLoads
      tags:
      - Batches
      summary: List Batch Loads
      description: Download pre-issued loading IDs for independent offline intake. Cursor pages use a stable sort
        plus UUID as tie-breaker; cursors are opaque, scoped to the filters and actor. Invalid cursors return
        400. Backend enforces factory and assignment scope. Field users see only their assigned trips or resources.
      x-roles:
      - weigher
      - driver
      - receiver
      - dispatcher
      - manager
      - admin
      x-idempotency: Safe read. No idempotency key.
      responses:
