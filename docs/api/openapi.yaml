      tags:
      - Trips
      summary: Record Trip Milestone
      description: Record a departure or end. Reject an end before departure or an incompatible committed milestone.
        Backend enforces factory and assignment scope. Field users see only their assigned trips or resources.
      x-roles:
      - driver
      - dispatcher
      - admin
      x-idempotency: Require Idempotency-Key. Replay the committed result for the same principal, operation, path,
        key and canonical request. Changed content returns 409. Reserve the key and commit the mutation, audit
        and response atomically; retain the key through the pilot retry window.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Milestone'
  /batches:
    get:
      operationId: listBatches
      tags:
      - Batches
      summary: List Batches
      description: List manifested batches. Cursor pages use a stable sort plus UUID as tie-breaker; cursors are
        opaque, scoped to the filters and actor. Invalid cursors return 400. Backend enforces factory and assignment
        scope. Field users see only their assigned trips or resources.
      x-roles:
      - weigher
      - driver
      - receiver
      - dispatcher
      - manager
      - admin
      x-idempotency: Safe read. No idempotency key.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - in: query
        name: trip_id
        schema:
          type: string
          format: uuid
        description: Restrict to this trip.
    post:
      operationId: createBatch
      tags:
      - Batches
      summary: Create Batch
      description: Register a batch on an existing trip. Derive its deadline from the versioned factory rule.
        Require null for unknown start time and a timestamp for observed or estimated time. Backend enforces factory
        and assignment scope. Field users see only their assigned trips or resources.
      x-roles:
      - weigher
      - dispatcher
      - admin
      x-idempotency: Require Idempotency-Key. Replay the committed result for the same principal, operation, path,
        key and canonical request. Changed content returns 409. Reserve the key and commit the mutation, audit
        and response atomically; retain the key through the pilot retry window.
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreate'
  /batches/{batch_id}:
    get:
      operationId: getBatch
      tags:
      - Batches
      summary: Get Batch
      description: Get the physical delivery and independent review states. Backend enforces factory and assignment
        scope. Field users see only their assigned trips or resources.
      x-roles:
      - weigher
      - driver
      - receiver
      - dispatcher
      - manager
      - admin
      x-idempotency: Safe read. No idempotency key.
